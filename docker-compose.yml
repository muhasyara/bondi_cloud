version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: password_rahasia
      MYSQL_DATABASE: db_inventaris
    volumes:
      - db_data:/var/lib/mysql
      - ./db_inventaris.sql:/docker-entrypoint-initdb.d/db_inventaris.sql
    restart: always

volumes:
  db_data: