version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/app
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: password_rahasia # Ganti dengan password pilihanmu
      MYSQL_DATABASE: db_bondi # Ganti dengan nama database aplikasimu
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data: