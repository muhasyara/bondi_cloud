<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BONDI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --emerald-deep: #0d2b1f;
            --emerald-mid: #14422e;
            --emerald-light: #1c5c40;
            --gold: #c9a84c;
            --gold-light: #e2c47a;
            --gold-pale: #f5e6b8;
            --cream: #faf6ee;
            --text-main: #f0ebe0;
            --text-muted: #a09070;
            --border: rgba(201, 168, 76, 0.25);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--emerald-deep);
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(28, 92, 64, 0.6) 0%, transparent 70%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Decorative corner lines */
        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(201, 168, 76, 0.15);
            pointer-events: none;
        }

        body::before {
            top: 24px;
            left: 24px;
            border-right: none;
            border-bottom: none;
        }

        body::after {
            bottom: 24px;
            right: 24px;
            border-left: none;
            border-top: none;
        }

        .login-box {
            background: linear-gradient(160deg, rgba(20, 66, 46, 0.9) 0%, rgba(13, 43, 31, 0.95) 100%);
            border: 1px solid var(--border);
            padding: 52px 44px 44px;
            width: 360px;
            text-align: center;
            position: relative;
            animation: fadeUp 0.7s ease both;
        }

        /* thin gold lines top & bottom */
        .login-box::before,
        .login-box::after {
            content: '';
            position: absolute;
            left: 20%;
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .login-box::before {
            top: 0;
        }

        .login-box::after {
            bottom: 0;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 10px;
            color: var(--gold);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .brand-tagline {
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .divider span {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider em {
            font-style: normal;
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .field-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .field-group label {
            display: block;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: 'Jost', sans-serif;
            font-size: 14px;
            font-weight: 300;
            outline: none;
            transition: border-color 0.25s, background 0.25s;
        }

        input::placeholder {
            color: rgba(160, 144, 112, 0.5);
        }

        input:focus {
            border-color: var(--gold);
            background: rgba(201, 168, 76, 0.05);
        }

        button {
            width: 100%;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 13px;
            font-family: 'Jost', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.3s, color 0.3s;
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s ease;
            z-index: 0;
        }

        button span {
            position: relative;
            z-index: 1;
        }

        button:hover::after {
            transform: scaleX(1);
        }

        button:hover {
            color: var(--emerald-deep);
        }

        .error-msg {
            color: #e07070;
            margin-top: 14px;
            font-size: 12px;
            letter-spacing: 0.5px;
            display: none;
            border-top: 1px solid rgba(224, 112, 112, 0.2);
            padding-top: 12px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="brand-logo">BONDI</div>
        <div class="brand-tagline">Warehouse Management System</div>

        <div class="divider"><span></span><em>Masuk</em><span></span></div>

        <form id="loginForm">
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit"><span>Masuk</span></button>
            <div id="errorMsg" class="error-msg">Username atau Password salah!</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            btn.querySelector('span').textContent = "Mengecek...";
            document.getElementById('errorMsg').style.display = 'none';

            const dataLogin = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                // MEMANGGIL API PHP MURNI
                const response = await fetch('api/api_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataLogin)
                });
                const result = await response.json();

                if (result.status === 'sukses') {
                    // Simpan data login di Session Storage browser
                    sessionStorage.setItem('role', result.role);
                    sessionStorage.setItem('username', result.username);

                    // Arahkan ke halaman dashboard
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                    btn.querySelector('span').textContent = "Masuk";
                }
            } catch (error) {
                alert("Gagal terhubung ke server. Pastikan XAMPP menyala.");
                btn.querySelector('span').textContent = "Masuk";
            }
        });
    </script>
</body>

</html>
