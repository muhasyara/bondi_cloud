name: Auto Deploy SINGKAT ke GCE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Kirim File ke GCE Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: github-actions
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/github-actions/app"

      - name: Eksekusi Setup & Run Otomatis
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: github-actions
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            # 1. OTOMATISASI INSTALL DOCKER
            if ! command -v docker-compose &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose
            fi

            # 2. MASUK KE FOLDER PROYEK
            cd /home/github-actions/app

            # 3. OTOMATISASI PEMBERSIHAN
            sudo docker-compose down || true
            sudo docker stop $(sudo docker ps -aq) || true
            sudo docker rm $(sudo docker ps -aq) || true
            sudo docker network prune -f

            # 4. BANGUN & NYALAKAN APLIKASI
            sudo docker-compose up -d --build


            