<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BONDI — Sistem Gudang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <h2>BONDI</h2>
            <small>Sistem Gudang &nbsp;|&nbsp; Halo, <b id="namaUser"></b> <span id="roleUser"></span></small>
        </div>
        <div class="header-actions">
            <button id="btnCetak" class="btn-cetak" onclick="cetakLaporan()">Print Report</button>
            <button class="btn-logout" onclick="logout()">Log Out</button>
        </div>
    </div>

    <div class="container">
        <div class="form-section" id="panelForm">
            <h3>MANAJEMEN TAS</h3>
            <form id="formTas">
                <input type="hidden" id="tasId">
                <label>BRAND</label>
                <input type="text" id="merk" required>
                <label>TYPE</label>
                <input type="text" id="tipe" required>
                <label>PRICE (Rp)</label>
                <input type="number" id="harga" required>
                <label>STOCK</label>
                <input type="number" id="stok" required>
                <button type="submit" class="btn-simpan">Simpan Data</button>
            </form>
        </div>

        <div class="table-section">
            <div id="printHeader" class="print-only" style="display: none;">
                <span id="waktuCetak"></span>
                <span>Dokumen Internal Gudang</span>
            </div>
            <h3>DAFTAR TAS - TOKO BONDI</h3>
            <div class="search-box">
                <input type="text" id="inputPencarian" placeholder="SEARCH">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>BRAND</th>
                        <th>TYPE</th>
                        <th>PRICE</th>
                        <th>STOCK</th>
                        <th class="aksi-kolom">OPTION</th>
                    </tr>
                </thead>
                <tbody id="tabelBody"></tbody>
            </table>
        </div>

        <div class="table-section" id="panelLog" style="display: none; margin-top: 28px; grid-column: 1 / -1;">
            <h3>Riwayat Aktivitas Gudang</h3>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Role</th>
                        <th style="text-align: left;">Action</th>
                    </tr>
                </thead>
                <tbody id="tabelLog"></tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
